[settings]
lockfile = true

[tools]
go = "1.27"
golangci-lint = "2.13"
goreleaser = "2.18"
lefthook = "2.1"
svu = "3.4"

# A fresh clone gets working git hooks from `mise install` alone. Note this
# requires `mise trust` first, since mise refuses to run hooks from an
# untrusted config.
[hooks]
postinstall = "lefthook install"

[tasks.build]
description = "Build snapshot"
run = "goreleaser release --snapshot --clean --skip=publish"

[tasks.test]
description = "Run the tests"
run = "go test -race -cover ./..."

[tasks."test:ci"]
description = "Run the test verbose with codecov"
run = "go test -race -v -coverprofile=coverage.out ./..."

[tasks.lint]
description = "Lint Go files"
run = "golangci-lint run ./..."

[tasks.format]
description = "Format Go files"
run = ["go fix ./...", "golangci-lint fmt"]
